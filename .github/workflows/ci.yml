name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Build admin website
        run: pnpm --filter @mana/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Bundle mobile app (Android)
        working-directory: apps/mobile
        run: pnpm exec expo export --platform android --output-dir /tmp/mobile-export
        env:
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies all migrations + dev seed)
        run: pnpm exec supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Database tests (RLS, workflow, history immutability)
        run: pnpm exec supabase test db
      - name: Generated types are up to date
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/database.ts
          diff -u packages/core/src/types/database.ts /tmp/database.ts
      - name: Services integration tests (real API, seeded users)
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          MANA_SUPABASE_URL="$API_URL" MANA_SUPABASE_ANON_KEY="$ANON_KEY" \
          MANA_SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY" pnpm --filter @mana/services test
